<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mjunoon Live TV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#fff; font-family:system-ui,sans-serif; }
  .player-wrap { max-width:900px; margin:0 auto; padding:16px; }
  video { width:100%; border-radius:12px; background:#000; aspect-ratio:16/9; }
  .controls { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  select, button {
    padding:10px 16px; border-radius:8px; border:none;
    background:#1e1e1e; color:#fff; font-size:14px; cursor:pointer;
  }
  button { background:#e50914; font-weight:600; }
  button:disabled { opacity: 0.5; }
  .status { margin-top:10px; font-size:13px; color:#888; word-break: break-all; }
  .status.live { color:#2ecc71; }
  .status.err { color:#e74c3c; }
</style>
</head>
<body>
<div class="player-wrap">
  <video id="video" controls autoplay muted playsinline></video>
  <div class="controls">
    <select id="channel">
      <option value="Madni-121|121H">Madni 121</option>
      <option value="K21-News|k21">K21 News</option>
      <option value="DW-English|dw">DW English</option>
      <option value="Al-Jazeera|aljazeera">Al Jazeera</option>
      <option value="Afghan-TV|afghan">Afghan TV</option>
    </select>
    <button id="loadBtn" onclick="loadStream()">▶ Load Stream</button>
  </div>
  <div class="status" id="status">Idle</div>
</div>

<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const loadBtn = document.getElementById('loadBtn');
let hls = null;

function setStatus(msg, cls='') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + cls;
}

async function loadStream() {
  const [channel, quality] = document.getElementById('channel').value.split('|');
  loadBtn.disabled = true;
  setStatus('Fetching fresh token & stream URL from server...');
  
  try {
    // Hum apne hi Vercel server ki API call kar rahe hain (CORS bypass)
    const response = await fetch('/api/stream', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ channel, quality })
    });
    
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Server error');

    // Agar response mein URL hai toh play karo
    const url = data.url || data.streaming_url || data.hls_url || data?.data?.url || data?.data?.streaming_url;
    if (!url) throw new Error('No URL found in response');
    
    playHLS(url);
  } catch (err) {
    setStatus('❌ ' + err.message, 'err');
  } finally {
    loadBtn.disabled = false;
  }
}

function playHLS(url) {
  if (hls) { hls.destroy(); hls = null; }
  
  // Hum URL ko apne server ke proxy se pass kar rahe hain (CORS bypass)
  const proxiedUrl = '/proxy?url=' + encodeURIComponent(url);
  setStatus('Loading Stream...');
  
  if (Hls.isSupported()) {
    hls = new Hls({
      lowLatencyMode: true,
      enableWorker: true,
      backBufferLength: 30,
      maxBufferLength: 15,
      maxMaxBufferLength: 30
    });
    hls.loadSource(proxiedUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(()=>{});
      setStatus('🟢 LIVE', 'live');
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) setStatus('❌ Error: ' + data.type + ' — ' + data.details, 'err');
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = proxiedUrl;
    video.play().catch(()=>{});
    setStatus('🟢 LIVE (native)', 'live');
  } else {
    setStatus('❌ HLS not supported', 'err');
  }
}
</script>
</body>
</html>
