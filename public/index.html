<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mjunoon Live TV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#fff; font-family:system-ui,sans-serif; }
  .player-wrap { max-width:900px; margin:0 auto; padding:16px; }
  video { width:100%; border-radius:12px; background:#000; aspect-ratio:16/9; }
  .controls { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  input, button {
    padding:10px 16px; border-radius:8px; border:none;
    background:#1e1e1e; color:#fff; font-size:14px; cursor:pointer;
  }
  input { flex: 1; min-width: 120px; }
  button { background:#e50914; font-weight:600; }
  button:disabled { opacity: 0.5; }
  .status { margin-top:10px; font-size:13px; color:#888; word-break: break-all; }
  .status.live { color:#2ecc71; }
  .status.err { color:#e74c3c; }
</style>
</head>
<body>
<div class="player-wrap">
  <video id="video" controls autoplay muted playsinline></video>
  <div class="controls">
    <!-- Ab aap yahan channel aur quality type kar sakte hain -->
    <input type="text" id="channelInput" value="tv-one-live" placeholder="Channel ID (e.g. tv-one-live)">
    <input type="text" id="qualityInput" value="hd" placeholder="Quality (e.g. hd, sd, live)">
    <button id="loadBtn" onclick="loadStream()">▶ Load Stream</button>
  </div>
  <div class="status" id="status">Idle</div>
</div>

<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const loadBtn = document.getElementById('loadBtn');
let hls = null;

function setStatus(msg, cls='') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + cls;
}

async function loadStream() {
  const channel = document.getElementById('channelInput').value;
  const quality = document.getElementById('qualityInput').value;
  
  if(!channel || !quality) {
    setStatus('❌ Channel aur Quality dono likhein', 'err');
    return;
  }

  loadBtn.disabled = true;
  setStatus('Fetching stream URL from server...');
  
  try {
    const response = await fetch('/api/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channel, quality })
    });
    
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Server error');

    const url = data.url || data.streaming_url || data.hls_url || data?.data?.url || data?.data?.streaming_url;
    if (!url) throw new Error('No URL found in response. Channel/Quality galat ho sakti hai.');
    
    playHLS(url);
  } catch (err) {
    setStatus('❌ ' + err.message, 'err');
  } finally {
    loadBtn.disabled = false;
  }
}

function playHLS(url) {
  if (hls) { hls.destroy(); hls = null; }
  
  const proxiedUrl = '/proxy?url=' + encodeURIComponent(url);
  setStatus('Loading Stream...');
  
  if (Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, enableWorker: true });
    hls.loadSource(proxiedUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(()=>{});
      setStatus('🟢 LIVE', 'live');
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) setStatus('❌ Error: ' + data.details, 'err');
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = proxiedUrl;
    video.play().catch(()=>{});
    setStatus('🟢 LIVE (native)', 'live');
  } else {
    setStatus('❌ HLS not supported', 'err');
  }
}
</script>
</body>
</html>
